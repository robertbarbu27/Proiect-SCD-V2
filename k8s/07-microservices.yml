# Toate cele 7 microservicii proprii EventFlow
---
# ── auth-service (port 3003) ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: eventflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: eventflow/auth-service:latest
          envFrom:
            - configMapRef:
                name: eventflow-config
          env:
            - name: PORT
              value: "3003"
          ports:
            - containerPort: 3003
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: eventflow
spec:
  selector:
    app: auth-service
  ports:
    - port: 3003
      targetPort: 3003
---
# ── user-profile-service (port 3004) ───────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-profile-service
  namespace: eventflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-profile-service
  template:
    metadata:
      labels:
        app: user-profile-service
    spec:
      containers:
        - name: user-profile-service
          image: eventflow/user-profile-service:latest
          envFrom:
            - configMapRef:
                name: eventflow-config
          env:
            - name: PORT
              value: "3004"
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventflow-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
          ports:
            - containerPort: 3004
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-profile-service
  namespace: eventflow
spec:
  selector:
    app: user-profile-service
  ports:
    - port: 3004
      targetPort: 3004
---
