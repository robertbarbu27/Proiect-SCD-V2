name: EventFlow CI/CD

on:
  push:
    branches: [main, master, 'Feat/**', 'feat/**']
  pull_request:
    branches: [main, master]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Lint Python (toate serviciile)
  # ──────────────────────────────────────────────────────────────────────────
  lint-python:
    name: Lint Python Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Lint all services
        run: |
          flake8 services/ \
            --max-line-length=120 \
            --extend-ignore=E501,W503,E402 \
            --exclude=services/ticketing-service/tests,services/payment-service/tests,**/__pycache__

  # ──────────────────────────────────────────────────────────────────────────
  # Validare configurații (docker-stack.yml + kong/kong.yml)
  # ──────────────────────────────────────────────────────────────────────────
  validate-configs:
    name: Validate Configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate YAML syntax
        run: |
          python - <<'EOF'
          import yaml, sys

          files = ['docker-stack.yml', 'kong/kong.yml', 'monitoring/prometheus.yml']
          errors = []
          for f in files:
              try:
                  yaml.safe_load(open(f))
                  print(f"  OK  {f}")
              except Exception as e:
                  errors.append(f"FAIL {f}: {e}")
                  print(f"FAIL {f}: {e}")
          if errors:
              sys.exit(1)
          EOF

  # ──────────────────────────────────────────────────────────────────────────
  # Build frontend (Vite)
  # ──────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite app
        working-directory: frontend
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────────
  # Unit tests (ticketing-service rate limiting + caching)
  # ──────────────────────────────────────────────────────────────────────────
  test-ticketing:
    name: Unit Tests - ticketing-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: services/ticketing-service
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: services/ticketing-service
        run: python -m pytest -v

  # ──────────────────────────────────────────────────────────────────────────
  # Unit tests (payment-service rate limiting)
  # ──────────────────────────────────────────────────────────────────────────
  test-payment:
    name: Unit Tests - payment-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: services/payment-service
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: services/payment-service
        run: python -m pytest -v

  # ──────────────────────────────────────────────────────────────────────────
  # Build Docker images (verifica ca Dockerfile-urile sunt valide)
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-python, validate-configs, build-frontend, test-ticketing, test-payment]
    strategy:
      matrix:
        service:
          - auth-service
          - user-profile-service
          - ticketing-service
          - notification-service
          - gate-service
          - payment-service
          - data-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: eventflow/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # Security scan (Trivy) - scanare vulnerabilități în codul sursă
  # ──────────────────────────────────────────────────────────────────────────
  trivy-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          skip-dirs: 'frontend/node_modules'

  # ──────────────────────────────────────────────────────────────────────────
  # Push la Docker Hub (doar pe branch main/master, dupa build + scan reusit)
  # ──────────────────────────────────────────────────────────────────────────
  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [build, trivy-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    strategy:
      matrix:
        service:
          - auth-service
          - user-profile-service
          - ticketing-service
          - notification-service
          - gate-service
          - payment-service
          - data-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eventflow-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eventflow-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
